<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin · Bueno Confeitaria</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet"/>
<style>
:root {
  --accent:      #c46935;
  --accent-dark: #9b4f22;
  --bg:          #f7f4f1;
  --surface:     #ffffff;
  --surface2:    #f0ece7;
  --border:      #e2d9d0;
  --text:        #2d1a0e;
  --muted:       #9a7a6a;
  --dim:         #bfa898;
  --green:       #16a34a;
  --yellow:      #b45309;
  --red:         #dc2626;
  --blue:        #2563eb;
  --sidebar-w:   232px;
  --ease:        cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* LOGIN */
#loginScreen{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{width:min(360px,90vw);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.25rem;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.07);}
.login-logo{font-family:'Playfair Display',serif;font-size:1.75rem;color:var(--accent);margin-bottom:.2rem;}
.login-tagline{font-size:.68rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:1.75rem;}
.login-field{margin-bottom:1rem;text-align:left;}
.login-label{display:block;font-size:.67rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.35rem;}
.login-input{width:100%;padding:10px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:.88rem;outline:none;transition:border-color .2s;font-family:inherit;}
.login-input:focus{border-color:var(--accent);}
.login-err{font-size:.76rem;color:var(--red);min-height:1rem;margin-bottom:.5rem;text-align:left;}
.login-btn{width:100%;padding:11px;background:var(--accent);border:none;border-radius:9px;color:#fff;font-size:.86rem;font-weight:700;cursor:pointer;transition:background .2s;font-family:inherit;}
.login-btn:hover{background:var(--accent-dark);}

/* APP */
#app{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s var(--ease);}
.sb-brand{padding:1.25rem 1.4rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-logo{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent);display:block;line-height:1.1;}
.sb-role{font-size:.6rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:.2rem;}
.sb-nav{padding:.5rem 0;flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.sb-item{display:flex;align-items:center;gap:.65rem;padding:.72rem 1.4rem;color:var(--muted);font-size:.82rem;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:color .15s,background .15s;border-left:2px solid transparent;font-family:inherit;}
.sb-item:hover{color:var(--text);background:var(--surface2);}
.sb-item.active{color:var(--accent);background:#fdf0e6;border-left-color:var(--accent);font-weight:600;}
.sb-divider{height:1px;background:var(--border);margin:.4rem 1.4rem;}
.sb-logout{margin-top:auto;}

/* MAIN */
#main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{padding:.9rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:50;gap:1rem;}
.topbar-left{display:flex;align-items:center;gap:.7rem;}
.topbar-title{font-size:1rem;font-weight:700;color:var(--text);}
.topbar-date{font-size:.7rem;color:var(--dim);}
.ham-btn{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:4px;padding:4px;}
.ham-btn span{width:18px;height:1.5px;background:var(--muted);border-radius:2px;display:block;}

/* PAGES */
.page{display:none;padding:1.75rem;}
.page.active{display:block;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.9rem;margin-bottom:1.75rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.15rem;}
.stat-label{font-size:.64rem;font-weight:600;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-bottom:.25rem;}
.stat-value{font-size:1.75rem;font-weight:800;color:var(--text);line-height:1;}
.stat-sub{font-size:.7rem;color:var(--dim);margin-top:.25rem;}

/* SEC HEADER */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;flex-wrap:wrap;gap:.6rem;}
.sec-hd-title{font-size:.92rem;font-weight:700;color:var(--text);}

/* BUTTONS */
.btn-sm{padding:7px 16px;border-radius:99px;font-size:.73rem;font-weight:600;cursor:pointer;border:none;transition:background .15s;font-family:inherit;}
.btn-wine{background:var(--accent);color:#fff;}
.btn-wine:hover{background:var(--accent-dark);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-outline:hover{border-color:var(--accent);color:var(--text);}
.btn-icon{padding:4px 11px;border-radius:7px;font-size:.71rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .15s;font-family:inherit;}
.btn-edit:hover{border-color:var(--accent);color:var(--accent);}
.btn-del:hover{border-color:var(--red);color:var(--red);}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:.81rem;}
thead th{padding:.7rem .9rem;text-align:left;background:var(--surface2);font-size:.63rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
tbody td{padding:.7rem .9rem;color:var(--text);vertical-align:middle;}

/* BADGES */
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
.badge-pend{background:#fef3c7;color:#92400e;}
.badge-prep{background:#dbeafe;color:#1d4ed8;}
.badge-pronto{background:#fde8d4;color:#9b4f22;}
.badge-done{background:#f0fdf4;color:#15803d;}
.badge-cancel{background:#fee2e2;color:#b91c1c;}

/* SELECT INLINE */
select.sel{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:.71rem;border-radius:7px;padding:5px 9px;cursor:pointer;outline:none;font-family:inherit;}

/* PERIOD TABS */
.period-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem;}
.period-tab{padding:6px 16px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.73rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;}
.period-tab.active,.period-tab:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

/* CHART */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.75rem;}
.chart-title{font-size:.83rem;font-weight:600;color:var(--text);margin-bottom:1.1rem;}
.bar-chart{display:flex;align-items:flex-end;gap:.4rem;height:150px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;min-width:0;}
.bar-fill{width:100%;border-radius:4px 4px 0 0;background:var(--accent);transition:height .4s var(--ease);min-height:3px;opacity:.85;}
.bar-lbl{font-size:.57rem;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.bar-val{font-size:.57rem;color:var(--muted);text-align:center;}

/* REPORT SUMMARY */
.report-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.9rem;margin-bottom:1.75rem;}
.rs-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:.9rem 1.1rem;}
.rs-label{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:.3rem;}
.rs-val{font-size:1.35rem;font-weight:800;color:var(--accent);}

/* PRODUTOS */
.cat-filter{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.1rem;}
.cf-btn{padding:5px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.73rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;}
.cf-btn.active,.cf-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.9rem;}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;gap:.5rem;}
.pc-photo-placeholder{width:100%;height:90px;border-radius:8px;border:1.5px dashed var(--border);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;color:var(--dim);margin-bottom:.15rem;}
.pc-photo-placeholder svg{opacity:.5;}
.pc-photo-placeholder span{font-size:.65rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;}
.pc-status{font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:99px;}
.pc-active{background:#f0fdf4;color:#15803d;}
.pc-inactive{background:#fee2e2;color:#b91c1c;}
.pc-name{font-size:.93rem;font-weight:600;color:var(--text);}
.pc-cat{font-size:.64rem;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;}
.pc-price{font-size:.97rem;font-weight:700;color:var(--accent);}
.pc-actions{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.15rem;}

/* MODAL */
#modal{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);}
#modal.open{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.75rem;width:min(460px,93vw);max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.1);}
.modal-title{font-size:.97rem;font-weight:700;color:var(--text);margin-bottom:1.25rem;}
.form-row{margin-bottom:.9rem;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.form-label{display:block;font-size:.66rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.32rem;}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:.86rem;outline:none;transition:border-color .15s;font-family:inherit;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
.form-textarea{resize:vertical;min-height:64px;}
.modal-actions{display:flex;gap:.65rem;justify-content:flex-end;margin-top:1.25rem;}

/* ORDER DETAIL */
.od-row{display:flex;gap:.5rem;padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.83rem;}
.od-row:last-child{border-bottom:none;}
.od-lbl{color:var(--muted);min-width:120px;font-weight:500;flex-shrink:0;}
.od-val{color:var(--text);flex:1;}
.od-item{padding:.25rem 0;font-size:.81rem;}

/* EMPTY */
.empty-state{text-align:center;padding:3.5rem 2rem;color:var(--dim);}
.empty-state p{font-size:.86rem;}

/* RESPONSIVE */
@media(max-width:800px){
  #sidebar{transform:translateX(-232px);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  .ham-btn{display:flex;}
  .page{padding:1.1rem;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .form-row-2{grid-template-columns:1fr;}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Bueno</div>
    <div class="login-tagline">Painel Administrativo</div>
    <div class="login-field">
      <label class="login-label" for="loginPass">Senha de acesso</label>
      <input type="password" id="loginPass" class="login-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="sb-brand">
      <span class="sb-logo">Bueno</span>
      <span class="sb-role">Administrador</span>
    </div>
    <nav class="sb-nav">
      <button class="sb-item active" id="nav-dashboard" onclick="navigate('dashboard')">Dashboard</button>
      <button class="sb-item" id="nav-pedidos" onclick="navigate('pedidos')">Pedidos</button>
      <button class="sb-item" id="nav-relatorios" onclick="navigate('relatorios')">Relatorios</button>
      <button class="sb-item" id="nav-produtos" onclick="navigate('produtos')">Produtos</button>
      <div class="sb-divider"></div>
      <div class="sb-logout">
        <button class="sb-item" onclick="logout()">Sair</button>
      </div>
    </nav>
  </aside>

  <div id="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="ham-btn" id="hamBtn" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <span class="topbar-title" id="topbarTitle">Dashboard</span>
      </div>
      <span class="topbar-date" id="topbarDate"></span>
    </div>

    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="stats-grid" id="dashStats"></div>
      <div class="sec-hd">
        <span class="sec-hd-title">Pedidos Recentes</span>
        <button class="btn-sm btn-outline" onclick="navigate('pedidos')">Ver todos</button>
      </div>
      <div class="tbl-wrap" id="dashTable"></div>
    </div>

    <!-- PEDIDOS -->
    <div class="page" id="page-pedidos">
      <div class="sec-hd">
        <span class="sec-hd-title">Todos os Pedidos</span>
        <select class="sel" id="filterSel" onchange="renderPedidos()">
          <option value="">Todos os status</option>
          <option>Pendente</option>
          <option>Em Preparo</option>
          <option>Pronto</option>
          <option>Entregue</option>
          <option>Cancelado</option>
        </select>
      </div>
      <div class="tbl-wrap" id="pedidosTbl"></div>
    </div>

    <!-- RELATÓRIOS -->
    <div class="page" id="page-relatorios">
      <div class="period-tabs" id="periodTabs">
        <button class="period-tab active" onclick="setPeriod('today',this)">Hoje</button>
        <button class="period-tab" onclick="setPeriod('week',this)">Esta Semana</button>
        <button class="period-tab" onclick="setPeriod('month',this)">Este Mês</button>
        <button class="period-tab" onclick="setPeriod('year',this)">Este Ano</button>
      </div>
      <div class="report-summary" id="reportSummary"></div>
      <div class="chart-wrap">
        <div class="chart-title" id="chartTitle">Receita</div>
        <div class="bar-chart" id="barChart"></div>
      </div>
      <div class="sec-hd"><span class="sec-hd-title">Pedidos do período</span></div>
      <div class="tbl-wrap" id="reportTbl"></div>
    </div>

    <!-- PRODUTOS -->
    <div class="page" id="page-produtos">
      <div class="sec-hd">
        <span class="sec-hd-title">Gerenciar Produtos</span>
        <button class="btn-sm btn-wine" onclick="openProdModal(null)">+ Novo Produto</button>
      </div>
      <div class="cat-filter" id="prodCatFilter"></div>
      <div class="prod-grid" id="prodGrid"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const PASS = 'admin123';
let currentPage = 'dashboard';
let activePeriod = 'today';
let activeProdCat = 'todos';

/* ── AUTH ── */
function doLogin(){
  const v = document.getElementById('loginPass').value;
  if(v === PASS){
    sessionStorage.setItem('bueno_auth','1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    init();
  } else {
    document.getElementById('loginErr').textContent = 'Senha incorreta.';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginPass').focus();
  }
}
function logout(){
  sessionStorage.removeItem('bueno_auth');
  location.reload();
}
if(sessionStorage.getItem('bueno_auth') === '1'){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  init();
}

/* ── UTILS ── */
function fmt(v){ return 'R$ ' + Number(v).toFixed(2).replace('.',','); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function badgeClass(s){
  return {Pendente:'badge-pend','Em Preparo':'badge-prep',Pronto:'badge-pronto',Entregue:'badge-done',Cancelado:'badge-cancel'}[s] || '';
}

/* ── INIT ── */
function init(){
  seedDemo();
  document.getElementById('topbarDate').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  navigate('dashboard');
}

/* ── NAVIGATE ── */
function navigate(page){
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
  const pageEl = document.getElementById('page-' + page);
  const navEl  = document.getElementById('nav-' + page);
  if(pageEl) pageEl.classList.add('active');
  if(navEl)  navEl.classList.add('active');
  const labels = {dashboard:'Dashboard',pedidos:'Pedidos',relatorios:'Relatórios',produtos:'Produtos'};
  document.getElementById('topbarTitle').textContent = labels[page] || page;
  document.getElementById('sidebar').classList.remove('open');
  if(page === 'dashboard')   renderDashboard();
  if(page === 'pedidos')     renderPedidos();
  if(page === 'relatorios')  renderRelatorios();
  if(page === 'produtos')    renderProdutos();
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

/* ── DASHBOARD ── */
function renderDashboard(){
  const orders = getOrders();
  const now = new Date();
  const startToday = new Date(now); startToday.setHours(0,0,0,0);
  const startWeek  = new Date(startToday); startWeek.setDate(startWeek.getDate()-6);
  const todayOrders = orders.filter(o => new Date(o.date) >= startToday);
  const weekOrders  = orders.filter(o => new Date(o.date) >= startWeek);
  const pending     = orders.filter(o => o.status === 'Pendente' || o.status === 'Em Preparo' || o.status === 'Pronto');
  const todayRev    = todayOrders.filter(o => o.status !== 'Cancelado').reduce((s,o) => s+o.total, 0);
  const weekRev     = weekOrders.filter(o => o.status !== 'Cancelado').reduce((s,o) => s+o.total, 0);
  const totalRev    = orders.filter(o => o.status !== 'Cancelado').reduce((s,o) => s+o.total, 0);

  document.getElementById('dashStats').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Pedidos Hoje</div>
      <div class="stat-value">${todayOrders.length}</div>
      <div class="stat-sub">${weekOrders.length} esta semana</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Receita Hoje</div>
      <div class="stat-value" style="font-size:1.35rem">${fmt(todayRev)}</div>
      <div class="stat-sub">${fmt(weekRev)} esta semana</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Em Aberto</div>
      <div class="stat-value" style="color:var(--yellow)">${pending.length}</div>
      <div class="stat-sub">aguardando ação</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Receita Total</div>
      <div class="stat-value" style="font-size:1.25rem;color:var(--gold)">${fmt(totalRev)}</div>
      <div class="stat-sub">${orders.filter(o=>o.status==='Entregue').length} pedidos entregues</div>
    </div>
  `;

  const recent = [...orders].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0,7);

}

/* ── RELATÓRIOS ── */
function setPeriod(p, btn){
  activePeriod = p;
  document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRelatorios();
}

function getRange(period){
  const now = new Date();
  let start = new Date(now); start.setHours(0,0,0,0);
  let end   = new Date(now); end.setHours(23,59,59,999);
  if(period === 'week'){ start.setDate(start.getDate()-6); }
  if(period === 'month'){ start = new Date(now.getFullYear(), now.getMonth(), 1); }
  if(period === 'year'){ start = new Date(now.getFullYear(), 0, 1); }
  return { start, end };
}

function renderRelatorios(){
  const { start, end } = getRange(activePeriod);
  const all = getOrders();
  const orders  = all.filter(o => { const d = new Date(o.date); return d >= start && d <= end; });
  const valid   = orders.filter(o => o.status !== 'Cancelado');
  const revenue = valid.reduce((s,o) => s+o.total, 0);
  const avg     = valid.length ? revenue / valid.length : 0;
  const cancel  = orders.filter(o => o.status === 'Cancelado').length;
  const pix     = valid.filter(o => o.pagamento === 'Pix').reduce((s,o) => s+o.total, 0);
  const card    = valid.filter(o => o.pagamento.includes('Cartão')).reduce((s,o) => s+o.total, 0);
  const cash    = valid.filter(o => o.pagamento === 'Dinheiro').reduce((s,o) => s+o.total, 0);

  document.getElementById('reportSummary').innerHTML = `
    <div class="rs-card"><div class="rs-label">Total de Pedidos</div><div class="rs-val">${orders.length}</div></div>
    <div class="rs-card"><div class="rs-label">Receita</div><div class="rs-val">${fmt(revenue)}</div></div>
    <div class="rs-card"><div class="rs-label">Ticket Médio</div><div class="rs-val">${fmt(avg)}</div></div>
    <div class="rs-card"><div class="rs-label">Entregues</div><div class="rs-val" style="color:var(--green)">${valid.filter(o=>o.status==='Entregue').length}</div></div>
    <div class="rs-card"><div class="rs-label">Cancelados</div><div class="rs-val" style="color:var(--red)">${cancel}</div></div>
    <div class="rs-card"><div class="rs-label">Via Pix</div><div class="rs-val" style="font-size:1.1rem">${fmt(pix)}</div></div>
    <div class="rs-card"><div class="rs-label">Via Cartão</div><div class="rs-val" style="font-size:1.1rem">${fmt(card)}</div></div>
    <div class="rs-card"><div class="rs-label">Dinheiro</div><div class="rs-val" style="font-size:1.1rem">${fmt(cash)}</div></div>
  `;
  renderChart(orders);

  const sorted = [...orders].sort((a,b) => new Date(b.date) - new Date(a.date));
  if(!sorted.length){
    document.getElementById('reportTbl').innerHTML = `<div class="empty-state"><p>Nenhum pedido neste periodo.</p></div>`;
    return;
  }
  document.getElementById('reportTbl').innerHTML = `<table>
    <thead><tr><th>#</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Pagamento</th><th>Data</th><th>Status</th></tr></thead>
    <tbody>
    ${sorted.map(o=>`<tr>
      <td style="color:var(--dim);font-size:.75rem">#${o.id}</td>
      <td style="font-size:.85rem">${o.cliente}</td>
      <td style="font-size:.76rem;color:var(--muted)">${o.itens.map(i=>i.qty+'x '+i.nome).join(', ')}</td>
      <td style="font-weight:700;color:var(--gold)">${fmt(o.total)}</td>
      <td style="font-size:.78rem">${o.pagamento}</td>
      <td style="font-size:.76rem;color:var(--muted);white-space:nowrap">${fmtDate(o.date)}</td>
      <td><span class="badge ${badgeClass(o.status)}">${o.status}</span></td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderChart(orders){
  const now = new Date();
  let slots = [];
  if(activePeriod === 'today'){
    for(let h=8;h<=20;h++) slots.push({
      label: h+'h',
      start: new Date(now.getFullYear(),now.getMonth(),now.getDate(),h),
      end:   new Date(now.getFullYear(),now.getMonth(),now.getDate(),h+1)
    });
    document.getElementById('chartTitle').textContent = 'Receita por hora — hoje';
  } else if(activePeriod === 'week'){
    for(let i=6;i>=0;i--){
      const d=new Date(now); d.setDate(d.getDate()-i);
      slots.push({
        label: d.toLocaleDateString('pt-BR',{weekday:'short'}),
        start: new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0),
        end:   new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59)
      });
    }
    document.getElementById('chartTitle').textContent = 'Receita por dia — últimos 7 dias';
  } else if(activePeriod === 'month'){
    const weekLabels = ['1ª sem','2ª sem','3ª sem','4ª sem'];
    const ms = new Date(now.getFullYear(),now.getMonth(),1);
    for(let i=0;i<4;i++){
      const s=new Date(ms); s.setDate(s.getDate()+i*7);
      const e=new Date(s);  e.setDate(e.getDate()+6); e.setHours(23,59,59);
      slots.push({label:weekLabels[i],start:s,end:e});
    }
    document.getElementById('chartTitle').textContent = 'Receita por semana — mês atual';
  } else {
    const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    for(let m=0;m<12;m++) slots.push({
      label: months[m],
      start: new Date(now.getFullYear(),m,1),
      end:   new Date(now.getFullYear(),m+1,0,23,59,59)
    });
    document.getElementById('chartTitle').textContent = 'Receita por mês — ano atual';
  }

  const vals = slots.map(s =>
    orders.filter(o => { const d=new Date(o.date); return d>=s.start && d<=s.end && o.status!=='Cancelado'; })
          .reduce((sum,o) => sum+o.total, 0)
  );
  const maxV = Math.max(...vals, 1);
  document.getElementById('barChart').innerHTML = slots.map((s,i) => `
    <div class="bar-col">
      <div class="bar-val">${vals[i] > 0 ? 'R$'+vals[i].toLocaleString('pt-BR') : ''}</div>
      <div class="bar-fill" style="height:${Math.max((vals[i]/maxV)*140, vals[i]>0?6:2)}px"></div>
      <div class="bar-lbl">${s.label}</div>
    </div>
  `).join('');
}

function saveProd(id){
  const nome  = document.getElementById('f-nome').value.trim();
  const preco = parseFloat(document.getElementById('f-preco').value);
  if(!nome || isNaN(preco) || preco < 0){ alert('Preencha nome e preço corretamente.'); return; }
  const prods = getProducts();
  const data  = {
    nome,
    desc:  document.getElementById('f-desc').value.trim(),
    emoji: document.getElementById('f-emoji').value.trim() || '🍰',
    cat:   document.getElementById('f-cat').value,
    preco,
    ativo: document.getElementById('f-ativo').value === '1',
  };
  if(id){
    const idx = prods.findIndex(p => p.id === id);
    if(idx !== -1) prods[idx] = { ...prods[idx], ...data };
  } else {
    data.id = Date.now();
    prods.push(data);
  }
  saveProducts(prods);
  closeModal();
  renderProdutos();
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
}
</script>
</body>
</html>
