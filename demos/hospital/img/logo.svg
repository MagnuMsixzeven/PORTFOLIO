<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="gAzul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#2196f3"/>
    </linearGradient>
    <linearGradient id="gCruz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5"/>
      <stop offset="100%" style="stop-color:#f5c518"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo círculo -->
  <circle cx="50" cy="50" r="44" fill="url(#gAzul)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#f5c518" stroke-width="1.5" opacity="0.5"/>

  <!-- Cruz médica -->
  <rect x="37" y="26" width="26" height="48" rx="4" fill="url(#gCruz)" opacity="0.95"/>
  <rect x="26" y="37" width="48" height="26" rx="4" fill="url(#gCruz)" opacity="0.95"/>

  <!-- Overlay claro sobre a cruz -->
  <rect x="40" y="29" width="20" height="42" rx="3" fill="#fff" opacity="0.12"/>
  <rect x="29" y="40" width="42" height="20" rx="3" fill="#fff" opacity="0.12"/>

  <!-- Texto principal -->
  <text x="105" y="34" font-family="'Inter','Plus Jakarta Sans',sans-serif" font-weight="900" font-size="17" fill="#e3eaf8" letter-spacing="-0.3">ASSOCIAÇÃO</text>
  <text x="105" y="57" font-family="'Inter','Plus Jakarta Sans',sans-serif" font-weight="900" font-size="22" fill="#2196f3" letter-spacing="-0.5">Zequinha Araújo</text>
  
  <!-- Linha separadora -->
  <line x1="105" y1="65" x2="310" y2="65" stroke="#f5c518" stroke-width="1.5" opacity="0.6"/>

  <!-- Subtítulo -->
  <text x="105" y="82" font-family="'Inter',sans-serif" font-weight="500" font-size="11" fill="#90aed4" letter-spacing="1.5">SAÚDE • EDUCAÇÃO • COMUNIDADE</text>
</svg>
