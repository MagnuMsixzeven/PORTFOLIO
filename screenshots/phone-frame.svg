<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" fill="none">
  <defs>
    <!-- Gradiente prata lateral -->
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#7a7a7a"/>
      <stop offset="12%"  stop-color="#c0c0c0"/>
      <stop offset="38%"  stop-color="#ebebeb"/>
      <stop offset="60%"  stop-color="#d4d4d4"/>
      <stop offset="82%"  stop-color="#b2b2b2"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <!-- Highlight vertical (topo mais claro, base mais escura) -->
    <linearGradient id="silverV" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="30%"  stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="70%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.12)"/>
    </linearGradient>
    <!-- Máscara: buraco transparente onde é a tela -->
    <mask id="fm">
      <rect width="390" height="780" fill="white"/>
      <rect x="19" y="19" width="352" height="742" rx="45" fill="black"/>
    </mask>
  </defs>

  <!-- Corpo externo prata (com recorte da tela) -->
  <rect x="5"  y="5"  width="380" height="770" rx="54" fill="url(#silver)" mask="url(#fm)"/>
  <!-- Highlight vertical sobre prata -->
  <rect x="5"  y="5"  width="380" height="770" rx="54" fill="url(#silverV)" mask="url(#fm)"/>
  <!-- Fio de luz no topo da borda -->
  <rect x="5"  y="5"  width="380" height="770" rx="54" fill="none"
        stroke="rgba(255,255,255,0.55)" stroke-width="1" mask="url(#fm)"/>
  <!-- Fio de sombra na base da borda -->
  <rect x="5"  y="5"  width="380" height="770" rx="54" fill="none"
        stroke="rgba(0,0,0,0.2)" stroke-width="0.5" mask="url(#fm)"/>

  <!-- Bisel escuro (anel entre prata e tela) -->
  <rect x="12" y="12" width="366" height="756" rx="48" fill="#141414" mask="url(#fm)"/>
  <!-- Fio de realce interno do bisel -->
  <rect x="12" y="12" width="366" height="756" rx="48" fill="none"
        stroke="rgba(255,255,255,0.06)" stroke-width="1" mask="url(#fm)"/>

  <!-- Botões volume (esquerda) -->
  <!-- Mute -->
  <rect x="0"   y="146" width="5.5" height="30"  rx="2.75" fill="#9a9a9a"/>
  <rect x="0"   y="146" width="5.5" height="30"  rx="2.75" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <!-- Vol + -->
  <rect x="0"   y="192" width="5.5" height="56"  rx="2.75" fill="#a8a8a8"/>
  <rect x="0"   y="192" width="5.5" height="56"  rx="2.75" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <!-- Vol - -->
  <rect x="0"   y="262" width="5.5" height="56"  rx="2.75" fill="#a8a8a8"/>
  <rect x="0"   y="262" width="5.5" height="56"  rx="2.75" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>

  <!-- Botão power (direita) -->
  <rect x="384.5" y="210" width="5.5" height="72" rx="2.75" fill="#a8a8a8"/>
  <rect x="384.5" y="210" width="5.5" height="72" rx="2.75" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>

  <!-- Dynamic Island (ilha dinâmica — pill no topo da tela) -->
  <rect x="143" y="25" width="104" height="28" rx="14" fill="#090909"/>
  <!-- Câmera dentro da ilha -->
  <circle cx="226" cy="39" r="7.5" fill="#0e0e0e"/>
  <circle cx="226" cy="39" r="5"   fill="#111"/>
  <circle cx="223.5" cy="36.5" r="1.8" fill="rgba(255,255,255,0.09)"/>

  <!-- Reflexo sutil na tela (brilho diagonal) -->
  <path d="M28 22 Q195 56 362 22 L362 210 Q195 244 28 210 Z" fill="rgba(255,255,255,0.045)"/>

  <!-- Barra home (base) -->
  <rect x="148" y="751" width="94" height="4" rx="2" fill="rgba(255,255,255,0.32)"/>
</svg>
